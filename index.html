<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATOTA - Öğretmen Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #f8fafc; }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .game-card { transition: all 0.3s ease; cursor: grab; }
        #progress-bar {
            transition: width 0.3s ease;
            height: 3px;
            background-color: #4f46e5;
        }
        .game-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); cursor: move; }
        .sortable-ghost { opacity: 0.4; background: #c7d2fe; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-indigo-700 text-white p-4 shadow-xl">
        <!-- Progress Bar -->
        <div class="fixed top-0 left-0 w-full z-[100]">
            <div id="progress-bar" class="w-0"></div>
        </div>

        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-chalkboard-teacher mr-3"></i> MATOTA Öğretmen Paneli
            </h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm opacity-90"></span>
                <button onclick="signOut()" class="bg-indigo-800 hover:bg-red-600 px-3 py-1 rounded transition text-sm">Çıkış</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        <!-- Auth Section -->
        <div id="auth-section" class="max-w-md mx-auto mt-10 p-8 bg-white rounded-3xl shadow-2xl border border-indigo-50">
            <div class="flex border-b mb-6">
                <button onclick="setAuthMode('login')" id="login-tab" class="flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold">Giriş Yap</button>
                <button onclick="setAuthMode('register')" id="register-tab" class="flex-1 pb-2 text-gray-400 font-bold">Kayıt Ol</button>
            </div>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-posta</label>
                    <input type="email" id="email" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                    <input type="password" id="password" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Giriş Yap</button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="hidden space-y-6">
            <!-- Tabs -->
            <div class="flex gap-4 md:gap-8 border-b mb-6 overflow-x-auto">
                <button onclick="switchTab('games')" id="tab-games" class="pb-2 px-4 tab-active transition whitespace-nowrap">Oyun Yönetimi</button>
                <button onclick="switchTab('categories')" id="tab-categories" class="pb-2 px-4 text-gray-500 transition whitespace-nowrap">Kategoriler</button>
                <button onclick="switchTab('students')" id="tab-students" class="pb-2 px-4 text-gray-500 transition whitespace-nowrap">Öğrenci Kaydı</button>
            </div>

            <!-- Games Tab Content -->
            <div id="games-content" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Left Pane: Category Tree -->
                <div class="md:col-span-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <h3 class="text-lg font-bold text-slate-700 px-2">Kategoriler</h3>
                    <div id="games-category-tree"></div>
                </div>

                <!-- Right Pane: Games Grid -->
                <div class="md:col-span-3 space-y-4">
                    <button onclick="openGameModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md transition w-full">
                        <i class="fas fa-plus mr-2"></i> Yeni Oyun Ekle
                    </button>
                    <div id="games-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 min-h-[200px]"></div>
                </div>
            </div>

            <!-- Categories Tab Content -->
            <div id="categories-content" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">Kategori Yönetimi</h2>
                    <div class="flex gap-3">
                        <input type="text" id="new-category-name" class="flex-grow p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Yeni ana kategori adı...">
                        <button onclick="addCategory(null)" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Ana Kategori Ekle</button>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100" id="categories-list"></div>
            </div>

            <!-- Students Tab Content -->
            <div id="students-content" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border-l-8 border-indigo-500">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Öğrenci Listesi</h2>
                        <p class="text-slate-500">Öğrencilere giriş şifrelerini buradan tanımlayın.</p>
                    </div>
                    <button onclick="openStudentModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md transition w-full md:w-auto">
                        <i class="fas fa-user-plus mr-2"></i> Yeni Öğrenci
                    </button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm overflow-x-auto border">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="p-4">E-posta</th>
                                <th class="p-4">Şifre</th>
                                <th class="p-4 text-right">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="students-list" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Oyun Ekleme/Düzenleme -->
    <div id="game-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 bg-indigo-50 border-b flex justify-between items-center">
                <h3 id="game-modal-title" class="text-xl font-bold text-indigo-900">Oyun Detayları</h3>
                <button onclick="closeGameModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="add-game-form" class="p-6 space-y-4">
                <input type="hidden" id="editing-game-id">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Oyun Başlığı</label>
                        <input type="text" id="game-title" class="w-full p-3 border rounded-xl outline-none" placeholder="Oyun Adı" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Kategori</label>
                        <select id="game-category" class="w-full p-3 border rounded-xl outline-none">
                            <option value="Genel">Genel</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">HTML Kodu</label>
                    <textarea id="game-html" rows="8" class="w-full p-3 border rounded-xl font-mono text-xs outline-none bg-slate-50" placeholder="<html>...</html>" required></textarea>
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="closeGameModal()" class="flex-1 py-3 border rounded-xl text-gray-600">İptal</button>
                    <button type="submit" id="game-save-btn" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">Değişiklikleri Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Öğrenci Kaydı -->
    <div id="student-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 bg-indigo-50 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-indigo-900">Yeni Öğrenci</h3>
                <button onclick="closeStudentModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="add-student-form" class="p-8 space-y-6">
                <input type="hidden" id="editing-student-id">
                <input type="email" id="student-email" class="w-full p-3 border rounded-xl outline-none" placeholder="Öğrenci E-postası" required>
                <input type="text" id="student-pass" class="w-full p-3 border rounded-xl outline-none" placeholder="Giriş Şifresi" required>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">Erişebileceği Kategoriler</label>
                    <div id="student-categories-checklist" class="space-y-2 max-h-40 overflow-y-auto p-3 bg-slate-50 rounded-lg">
                        <!-- Kategoriler buraya dinamik olarak eklenecek -->
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold shadow-md">Kaydet</button>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://eygvzptaynyysagvgwyh.supabase.co';
        const supabaseKey = 'sb_publishable_JixS3C4jQ2Znrgcr3-IZPg_1MfpvdXW';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        const appId = 'matota_project_v1';
        let authMode = 'login';
        let globalData = { games: [], students: [], categories: [] };
        let sortable = null;
        let currentCategoryView = 'Genel';

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showDashboard(session.user);
        };

        function setAuthMode(mode) {
            authMode = mode;
            document.getElementById('login-tab').className = mode === 'login' ? "flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold" : "flex-1 pb-2 text-gray-400 font-bold";
            document.getElementById('register-tab').className = mode === 'register' ? "flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold" : "flex-1 pb-2 text-gray-400 font-bold";
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? "Giriş Yap" : "Kayıt Ol";
        }

        async function showDashboard(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            loadData();
        }

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = authMode === 'login' ? 
                await supabaseClient.auth.signInWithPassword({ email, password }) : 
                await supabaseClient.auth.signUp({ email, password });
            if (error) alert(error.message); else showDashboard(data.user);
        };

        async function loadData() {
            const { data, error } = await supabaseClient.from('artifacts').select('data').eq('id', appId).single();
            globalData = data?.data || { games: [], students: [], categories: [] };
            if (!globalData.categories) globalData.categories = [];
            
            renderGameView(currentCategoryView);
            renderStudents();
            renderCategoriesTab(); // For the categories tab
            renderGameCategoryTree(); // For the games tab
            updateCategoryDropdown();
        }

        function renderGameView(category) {
            currentCategoryView = category;
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            // Update active state in category tree
            document.querySelectorAll('#games-category-tree .category-node').forEach(node => {
                node.classList.toggle('bg-indigo-100', node.dataset.category === category);
            });

            const gamesInCategory = globalData.games.filter(g => (g.category || 'Genel') === category);
            if (gamesInCategory.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-gray-400 italic">Bu kategoride henüz oyun yok.</p>';
            } else {
                gamesInCategory.forEach(game => grid.appendChild(createGameCard(game)));
            }
            initSortable();
        }

        function renderGameCategoryTree() {
            const treeContainer = document.getElementById('games-category-tree');
            treeContainer.innerHTML = '';
            const categoryTree = buildCategoryTree(['Genel', ...globalData.categories]);

            Object.keys(categoryTree).sort().forEach(mainCat => {
                treeContainer.appendChild(createGameCategoryNode(mainCat, categoryTree[mainCat], 0));
            });
        }

        function createGameCategoryNode(name, children, level) {
            const node = document.createElement('div');
            const fullName = name;
            const displayName = name.split('>').pop().trim();
            
            node.className = `category-node p-2 rounded-lg cursor-pointer hover:bg-indigo-50 ${level > 0 ? 'ml-4' : ''}`;
            node.dataset.category = fullName;
            node.innerHTML = `<span class="font-medium text-slate-600 text-sm">${displayName}</span>`;
            node.onclick = () => renderGameView(fullName);

            // Make it a drop target for games
            new Sortable(node, {
                group: 'shared',
                animation: 150,
                onAdd: async (evt) => {
                    const gameId = evt.item.dataset.id;
                    const newCategory = fullName;
                    const game = globalData.games.find(g => g.id === gameId);
                    if (game) {
                        game.category = newCategory;
                        await saveData();
                        renderGameView(currentCategoryView); // Refresh current view
                    }
                }
            });

            if (children && Object.keys(children).length > 0) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'mt-1';
                Object.keys(children).sort().forEach(childKey => {
                    const fullChildName = `${name} > ${childKey}`;
                    childrenContainer.appendChild(createGameCategoryNode(fullChildName, children[childKey], level + 1));
                });
                node.appendChild(childrenContainer);
            }
            return node;
        }

        function createGameCard(game) {
            const div = document.createElement('div');
            div.className = "game-card bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between h-full";
            div.dataset.id = game.id;
            div.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-2">
                        <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-xs font-bold">${game.category || 'Genel'}</span>
                        <i class="fas fa-grip-vertical text-slate-300 cursor-move"></i>
                    </div>
                    <h4 class="font-bold text-md mb-3 text-slate-800">${game.title}</h4>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-50">
                     <button onclick="editGame(event, '${game.id}')" class="text-indigo-600 font-bold hover:underline text-xs"><i class="fas fa-edit mr-1"></i> Düzenle</button>
                     <button onclick="deleteItem(event, '${game.id}', 'games')" class="text-red-400 hover:text-red-600 transition p-1"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            return div;
        }

        function initSortable() {
            const grid = document.getElementById('games-grid');
            if (sortable) sortable.destroy();
            sortable = new Sortable(grid, { 
                group: 'shared', // Allow dragging between lists
                animation: 150, 
                ghostClass: 'sortable-ghost',
                onEnd: async (evt) => {
                    // This handles reordering within the same category
                    if (evt.from === evt.to) {
                        const newOrder = Array.from(evt.to.children).map(item => item.dataset.id);
                        globalData.games.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
                        await saveData();
                    }
                }
            });
        }

        function renderCategoriesTab() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            const categoryTree = buildCategoryTree(globalData.categories);

            if (Object.keys(categoryTree).length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 italic">Henüz kategori eklenmemiş.</p>';
                return;
            }

            Object.keys(categoryTree).sort().forEach(mainCat => {
                list.appendChild(createCategoryManagementNode(mainCat, categoryTree[mainCat], 0));
            });
        }

        function createCategoryManagementNode(name, children, level) {
            const node = document.createElement('div');
            const fullName = name;
            const displayName = name.split('>').pop().trim();
            node.className = `p-3 rounded-lg hover:bg-slate-50 ${level > 0 ? 'ml-8 border-l-2' : ''}`;
            node.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-800">${displayName}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="promptAddSubCategory('${fullName}')" class="text-emerald-500 hover:text-emerald-700 w-6 h-6 rounded-full flex items-center justify-center" title="Alt Kategori Ekle"><i class="fas fa-plus"></i></button>
                        <button onclick="deleteCategory('${fullName}')" class="text-red-400 hover:text-red-600 w-6 h-6 rounded-full flex items-center justify-center" title="Kategoriyi Sil"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `;
            if (children && Object.keys(children).length > 0) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'mt-2';
                Object.keys(children).sort().forEach(childKey => {
                    const fullChildName = `${name} > ${childKey}`;
                    childrenContainer.appendChild(createCategoryManagementNode(fullChildName, children[childKey], level + 1));
                });
                node.appendChild(childrenContainer);
            }
            return node;
        }

        function promptAddSubCategory(parentCategory) {
            const subCategoryName = prompt(`'${parentCategory}' için yeni alt kategori adı:`);
            if (subCategoryName && subCategoryName.trim()) {
                addCategory(parentCategory, subCategoryName.trim());
            }
        }

        function buildCategoryTree(categories) {
            const tree = {};
            categories.sort().forEach(cat => {
                const parts = cat.split('>').map(p => p.trim());
                let currentLevel = tree;
                parts.forEach(part => {
                    if (!currentLevel[part]) {
                        currentLevel[part] = {};
                    }
                    currentLevel = currentLevel[part];
                });
            });
            return tree;
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('game-category');
            select.innerHTML = '<option value="Genel">Genel</option>';
            globalData.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        async function addCategory(parent, newPart = null) {
            let name;
            if (parent && newPart) {
                name = `${parent} > ${newPart}`;
            } else {
                const input = document.getElementById('new-category-name');
                name = input.value.trim();
                input.value = "";
            }

            if (!name) return;
            if (globalData.categories.includes(name)) {
                alert("Bu kategori zaten mevcut.");
                return;
            }
            
            globalData.categories.push(name);
            await saveData();
            renderCategoriesTab();
            renderGameCategoryTree();
            updateCategoryDropdown();
        }

        async function deleteCategory(name) {
            if (!confirm(`"${name}" kategorisini ve tüm alt kategorilerini silmek istediğinize emin misiniz? Bu kategorideki oyunlar 'Genel' kategorisine taşınacaktır.`)) return;
            
            const categoriesToDelete = globalData.categories.filter(c => c === name || c.startsWith(name + ' > '));
            
            // İlgili oyunları 'Genel' kategorisine taşı
            globalData.games.forEach(game => {
                if (categoriesToDelete.includes(game.category)) {
                    game.category = 'Genel';
                }
            });

            // Kategori ve tüm alt kategorilerini sil
            globalData.categories = globalData.categories.filter(c => !categoriesToDelete.includes(c));

            await saveData();
            renderCategoriesTab();
            renderGameCategoryTree();
            renderGameView(currentCategoryView);
            updateCategoryDropdown();
        }

        function renderStudents() {
            const list = document.getElementById('students-list');
            list.innerHTML = globalData.students.length ? '' : '<tr><td colspan="3" class="p-10 text-center text-gray-400">Henüz öğrenci kaydı yok.</td></tr>';
            globalData.students.forEach(s => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                const allowed = s.allowedCategories && s.allowedCategories.length > 0 ? s.allowedCategories.join(', ') : 'Tümü';
                tr.innerHTML = `
                    <td class="p-4 font-medium text-slate-700">
                        ${s.email}
                        <p class="text-xs text-indigo-500 font-normal">${allowed}</p>
                    </td>
                    <td class="p-4 font-mono text-sm text-slate-500">${s.password}</td>
                    <td class="p-4 text-right">
                        <button onclick="editStudent('${s.id}')" class="text-indigo-500 hover:text-indigo-700 transition mr-2"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem(event, '${s.id}', 'students')" class="text-red-400 hover:text-red-600 transition"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function populateStudentCategoryChecklist(selectedCategories = []) {
            const container = document.getElementById('student-categories-checklist');
            container.innerHTML = '';
            if (globalData.categories.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 italic">Önce kategori eklemelisiniz.</p>';
                return;
            }
            globalData.categories.forEach(cat => {
                const isChecked = selectedCategories.includes(cat);
                container.innerHTML += `
                    <label class="flex items-center gap-2 p-2 rounded-md hover:bg-slate-100 cursor-pointer">
                        <input type="checkbox" value="${cat}" class="student-category-check" ${isChecked ? 'checked' : ''}>
                        <span class="text-sm font-medium text-slate-600">${cat}</span>
                    </label>
                `;
            });
        }

        async function editGame(event, id) {
            event.stopPropagation();
            const game = globalData.games.find(g => g.id === id);
            if (!game) return;
            document.getElementById('editing-game-id').value = game.id;
            document.getElementById('game-title').value = game.title;
            document.getElementById('game-category').value = game.category || 'Genel';
            document.getElementById('game-html').value = game.html;
            document.getElementById('game-modal-title').innerText = "Oyunu Düzenle";
            openGameModal();
        }

        function editStudent(id) {
            const student = globalData.students.find(s => s.id === id);
            if (!student) return;
            document.getElementById('editing-student-id').value = student.id;
            document.getElementById('student-email').value = student.email;

        function renderGameView(category = null) {
            currentCategoryView = category;

            const title = document.getElementById('games-view-title');
            grid.innerHTML = '';

            if (category) {
                // Belirli bir kategorideki oyunları göster
                title.innerHTML = `<button onclick="renderGameView()" class="text-indigo-500 hover:underline"><i class="fas fa-arrow-left mr-2"></i>Kategoriler</button> / ${category}`;

                if (gamesInCategory.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center py-10 text-gray-400 italic">Bu kategoride henüz oyun yok.</p>';
                } else {
                    gamesInCategory.forEach(game => grid.appendChild(createGameCard(game)));
                }
                initSortable(true);
            } else {
                // Kategori klasörlerini göster
                title.innerText = 'Oyun Modülleri';

                categories.forEach(cat => {
                    const gameCount = globalData.games.filter(g => (g.category || 'Genel') === cat).length;
                    const folder = document.createElement('div');
                    folder.className = "bg-indigo-50 p-6 rounded-2xl shadow-sm border border-indigo-100 flex flex-col justify-between h-full cursor-pointer hover:bg-indigo-100 hover:shadow-md transition-all";

                    folder.innerHTML = `
                        <div class="flex justify-between items-start">
                            <i class="fas fa-folder text-4xl text-indigo-400"></i>

                        </div>
                        <h4 class="font-bold text-lg mt-4 text-indigo-800">${cat}</h4>
                    `;
                    grid.appendChild(folder);
                });
                if (sortable) {
                    sortable.destroy();
                    sortable = null;
                }
            }
        }

        function renderGames() {
            const grid = document.getElementById('games-grid');

            globalData.games.forEach(game => {
                grid.appendChild(createGameCard(game));
            });
            initSortable(true);

        function createGameCard(game) {
            const div = document.createElement('div');
            div.className = "game-card bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between h-full";
            div.dataset.id = game.id;
            div.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-grip-vertical text-slate-300"></i>

                        </div>
                    </div>
                    <h4 class="font-bold text-lg mb-4 text-slate-800">${game.title}</h4>
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                     <button onclick="editGame(event, '${game.id}')" class="text-indigo-600 font-bold hover:underline text-sm"><i class="fas fa-edit mr-1"></i> Düzenle</button>
                     <button onclick="deleteItem(event, '${game.id}', 'games')" class="text-red-400 hover:text-red-600 transition p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            return div;
        }

        function initSortable(isGameGrid) {
            const grid = document.getElementById('games-grid');
            if (sortable) sortable.destroy();
            if (!isGameGrid) return;
            sortable = new Sortable(grid, { animation: 150, ghostClass: 'sortable-ghost',
                onEnd: async (evt) => {
                    const newOrder = Array.from(evt.to.children).map(item => item.dataset.id);
                    globalData.games.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
                    await saveData();
                }
            });
        }

        function renderCategories() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            const categoryTree = buildCategoryTree(globalData.categories);

            if (Object.keys(categoryTree).length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 italic">Henüz kategori eklenmemiş.</p>';
                return;
            }

            Object.keys(categoryTree).sort().forEach(mainCat => {
                list.appendChild(createCategoryNode(mainCat, categoryTree[mainCat], 0));
            });
        }

        function createCategoryNode(name, children, level) {
            const node = document.createElement('div');
            const fullName = name;
            const displayName = name.split('>').pop().trim();
            node.className = `p-3 rounded-lg hover:bg-slate-50 ${level > 0 ? 'ml-8 border-l-2' : ''}`;
            node.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-800">${displayName}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="promptAddSubCategory('${fullName}')" class="text-emerald-500 hover:text-emerald-700 w-6 h-6 rounded-full flex items-center justify-center" title="Alt Kategori Ekle"><i class="fas fa-plus"></i></button>
                        <button onclick="deleteCategory('${fullName}')" class="text-red-400 hover:text-red-600 w-6 h-6 rounded-full flex items-center justify-center" title="Kategoriyi Sil"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `;
            if (children && Object.keys(children).length > 0) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'mt-2';
                Object.keys(children).sort().forEach(childKey => {
                    const fullChildName = `${name} > ${childKey}`;
                    childrenContainer.appendChild(createCategoryNode(fullChildName, children[childKey], level + 1));
                });
                node.appendChild(childrenContainer);
            }
            return node;
        }

        function promptAddSubCategory(parentCategory) {
            const subCategoryName = prompt(`'${parentCategory}' için yeni alt kategori adı:`);
            if (subCategoryName && subCategoryName.trim()) {
                addCategory(parentCategory, subCategoryName.trim());
            }
        }

        function buildCategoryTree(categories) {
            const tree = {};
            categories.sort().forEach(cat => {
                const parts = cat.split('>').map(p => p.trim());
                let currentLevel = tree;
                parts.forEach(part => {
                    if (!currentLevel[part]) {
                        currentLevel[part] = {};
                    }
                    currentLevel = currentLevel[part];
                });
            });
            return tree;
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('game-category');
            select.innerHTML = '<option value="">Kategori Seçin</option>';
            globalData.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        async function addCategory(parent, newPart = null) {
            let name;
            if (parent && newPart) {
                name = `${parent} > ${newPart}`;
            } else {
                const input = document.getElementById('new-category-name');
                name = input.value.trim();
                input.value = "";
            }

            if (!name) return;
            if (globalData.categories.includes(name)) {
                alert("Bu kategori zaten mevcut.");
                return;
            }
            
            globalData.categories.push(name);
            await saveData();
            renderCategories();
            updateCategoryDropdown();
        }

        async function deleteCategory(name) {
            if (!confirm(`"${name}" kategorisini silmek istediğinize emin misiniz? Oyunlar silinmez ancak kategorisiz kalır.`)) return;
            
            // Kategori ve tüm alt kategorilerini sil
            globalData.categories = globalData.categories.filter(c => c !== name && !c.startsWith(name + ' > '));
            // Bu kategoriye bağlı oyunları "Genel"e taşı
            globalData.games.forEach(game => { if (game.category === name) game.category = 'Genel'; });

            await saveData();
            renderCategories();
            updateCategoryDropdown();
        }

            document.getElementById('student-modal').classList.add('hidden'); 
            document.getElementById('add-student-form').reset(); 
            document.getElementById('editing-student-id').value = "";
        }
        async function signOut() { await supabaseClient.auth.signOut(); location.reload(); }
    </script>
